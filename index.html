<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حالات المادة 🔬</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --solid-color: #FF6B6B;
    --solid-light: #FFE8E8;
    --liquid-color: #4ECDC4;
    --liquid-light: #E0FAF8;
    --gas-color: #A78BFA;
    --gas-light: #EDE9FE;
    --bg: #FFF9F0;
    --text: #2D1B4E;
    --font: 'Tajawal', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    background-image: 
      radial-gradient(circle at 20% 20%, #FFE8E833 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #E0FAF833 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, #EDE9FE22 0%, transparent 70%);
  }

  /* Header */
  .header {
    text-align: center;
    padding: 16px 12px 10px;
    position: relative;
  }
  .header h1 {
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
  }
  .header h1 span { color: #FF6B6B; }
  .student-name {
    font-size: 13px;
    font-weight: 700;
    color: #9CA3AF;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .student-name span {
    color: #A78BFA;
    font-weight: 800;
  }
  .score-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .star { font-size: 22px; filter: grayscale(1); transition: all 0.4s; }
  .star.lit { filter: none; animation: starPop 0.4s ease; }
  @keyframes starPop { 0%{transform:scale(0)} 60%{transform:scale(1.4)} 100%{transform:scale(1)} }

  /* Drop Zones */
  .zones {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 8px 10px;
  }

  .zone {
    border-radius: 20px;
    padding: 10px 6px;
    text-align: center;
    border: 3px dashed transparent;
    transition: all 0.3s;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow: hidden;
  }
  .zone.solid { background: var(--solid-light); border-color: var(--solid-color); }
  .zone.liquid { background: var(--liquid-light); border-color: var(--liquid-color); }
  .zone.gas { background: var(--gas-light); border-color: var(--gas-color); }

  .zone-icon { font-size: 28px; margin-bottom: 4px; }
  .zone-label { font-size: 13px; font-weight: 800; color: var(--text); }
  .zone.solid .zone-label { color: var(--solid-color); }
  .zone.liquid .zone-label { color: #0EA5E9; }
  .zone.gas .zone-label { color: var(--gas-color); }

  .zone.drag-over {
    transform: scale(1.04);
    box-shadow: 0 0 0 4px currentColor;
  }
  .zone.solid.drag-over { box-shadow: 0 0 0 4px var(--solid-color); }
  .zone.liquid.drag-over { box-shadow: 0 0 0 4px var(--liquid-color); }
  .zone.gas.drag-over { box-shadow: 0 0 0 4px var(--gas-color); }

  .zone-items {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 6px;
  }
  .zone-item {
    font-size: 26px;
    animation: dropIn 0.4s ease;
  }
  @keyframes dropIn { from{transform:scale(0) rotate(-20deg);opacity:0} to{transform:scale(1) rotate(0deg);opacity:1} }

  /* Glow on zone when correct */
  .zone.glow-correct { animation: zoneGlow 0.6s ease; }
  @keyframes zoneGlow {
    0%{box-shadow: 0 0 0 0 #22c55e55}
    50%{box-shadow: 0 0 30px 10px #22c55e88}
    100%{box-shadow: 0 0 0 0 #22c55e00}
  }

  /* Instruction */
  .instruction {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #6B7280;
    padding: 4px 16px 8px;
  }

  /* Items Grid */
  .items-section {
    padding: 4px 10px 12px;
  }
  .items-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .drag-item {
    background: white;
    border-radius: 18px;
    padding: 12px 8px 8px;
    text-align: center;
    cursor: grab;
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    border: 2.5px solid #E5E7EB;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    touch-action: none;
    gap: 4px;
  }
  .drag-item:active { cursor: grabbing; }
  .drag-item .emoji { font-size: 34px; line-height: 1; }
  .drag-item .name { font-size: 12px; font-weight: 800; color: var(--text); }

  .drag-item:hover, .drag-item:active {
    transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    z-index: 10;
  }
  .drag-item.dragging {
    opacity: 0.4;
    transform: scale(0.95);
  }
  .drag-item.solved {
    opacity: 0;
    pointer-events: none;
    transform: scale(0);
    transition: all 0.3s ease;
  }
  .drag-item.shake {
    animation: shake 0.5s ease;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px) rotate(-3deg)}
    40%{transform:translateX(8px) rotate(3deg)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }

  /* Ghost element for drag */
  #drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 44px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
    display: none;
  }

  /* Feedback Popup */
  .feedback {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: white;
    border-radius: 20px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 800;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    text-align: center;
    white-space: nowrap;
  }
  .feedback.show { transform: translateX(-50%) scale(1); }
  .feedback.correct { border: 3px solid #22c55e; color: #16a34a; }
  .feedback.wrong { border: 3px solid #ef4444; color: #dc2626; }

  /* Confetti Canvas */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 200;
  }

  /* Win Screen */
  .win-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    z-index: 300;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 30px;
    animation: winFadeIn 0.5s ease;
  }
  .win-screen.show { display: flex; }
  @keyframes winFadeIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
  .win-screen .trophy { font-size: 80px; animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
  .win-screen h2 { font-size: clamp(22px, 6vw, 32px); font-weight: 900; margin: 16px 0 8px; }
  .win-screen p { font-size: 16px; opacity: 0.9; margin-bottom: 30px; }
  .replay-btn {
    background: white;
    color: #764ba2;
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 900;
    font-family: var(--font);
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  .replay-btn:hover { transform: scale(1.05); }

  /* Particles */
  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 150;
    font-size: 20px;
    animation: particleFly 0.8s ease-out forwards;
  }
  @keyframes particleFly {
    from { transform: translateY(0) scale(1); opacity: 1; }
    to { transform: translateY(-80px) scale(0); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="drag-ghost"></div>

<!-- Win Screen -->
<div class="win-screen" id="winScreen">
  <div class="trophy">🏆</div>
  <h2>🎉 أحسنت! أنت بطل حالات المادة!</h2>
  <p>صنّفت كل العناصر بشكل صحيح! ممتاز جداً 🌟</p>
  <button class="replay-btn" onclick="resetGame()">🔄 العب مرة أخرى</button>
</div>

<!-- Header -->
<div class="header">
  <h1>حالات <span>المادة</span> 🔬</h1>
  <div class="student-name">✏️ عمل الطالبة: <span>سما حمزة يوسف</span></div>
  <div class="score-bar" id="scoreBar">
    <span class="star" id="s1">⭐</span>
    <span class="star" id="s2">⭐</span>
    <span class="star" id="s3">⭐</span>
    <span class="star" id="s4">⭐</span>
    <span class="star" id="s5">⭐</span>
    <span class="star" id="s6">⭐</span>
  </div>
</div>

<!-- Drop Zones -->
<div class="zones">
  <div class="zone solid" id="zone-solid" data-type="solid">
    <div class="zone-icon">🪨</div>
    <div class="zone-label">صلب</div>
    <div class="zone-items" id="items-solid"></div>
  </div>
  <div class="zone liquid" id="zone-liquid" data-type="liquid">
    <div class="zone-icon">💧</div>
    <div class="zone-label">سائل</div>
    <div class="zone-items" id="items-liquid"></div>
  </div>
  <div class="zone gas" id="zone-gas" data-type="gas">
    <div class="zone-icon">☁️</div>
    <div class="zone-label">غاز</div>
    <div class="zone-items" id="items-gas"></div>
  </div>
</div>

<div class="instruction">👆 اسحب كل عنصر إلى مكانه الصحيح!</div>

<!-- Draggable Items -->
<div class="items-section">
  <div class="items-grid" id="itemsGrid">
    <!-- generated by JS -->
  </div>
</div>

<!-- Feedback -->
<div class="feedback" id="feedback"></div>

<script>
const ITEMS = [
  { id:'rock',  emoji:'🪨', name:'حجر',   type:'solid'  },
  { id:'ice',   emoji:'🧊', name:'ثلج',   type:'solid'  },
  { id:'wood',  emoji:'🪵', name:'خشب',   type:'solid'  },
  { id:'water', emoji:'💧', name:'ماء',   type:'liquid' },
  { id:'juice', emoji:'🧃', name:'عصير',  type:'liquid' },
  { id:'milk',  emoji:'🥛', name:'حليب',  type:'liquid' },
  { id:'cloud', emoji:'☁️', name:'سحابة', type:'gas'    },
  { id:'steam', emoji:'🌫️', name:'بخار',  type:'gas'    },
  { id:'ballon',emoji:'🎈', name:'هواء',  type:'gas'    },
];

let score = 0;
let draggedId = null;
let touchOffsetX = 0, touchOffsetY = 0;
const ghost = document.getElementById('drag-ghost');
const feedbackEl = document.getElementById('feedback');
let feedbackTimer = null;

function buildItems() {
  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';
  const shuffled = [...ITEMS].sort(() => Math.random() - 0.5);
  shuffled.forEach(item => {
    const div = document.createElement('div');
    div.className = 'drag-item';
    div.id = 'item-' + item.id;
    div.dataset.id = item.id;
    div.innerHTML = `<div class="emoji">${item.emoji}</div><div class="name">${item.name}</div>`;

    // Mouse drag
    div.draggable = true;
    div.addEventListener('dragstart', e => {
      draggedId = item.id;
      div.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('dragend', () => div.classList.remove('dragging'));

    // Touch drag
    div.addEventListener('touchstart', onTouchStart, { passive: false });

    grid.appendChild(div);
  });
}

// Drop zone listeners
document.querySelectorAll('.zone').forEach(zone => {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (draggedId) handleDrop(zone.dataset.type, zone, draggedId);
    draggedId = null;
  });
});

// Touch handlers
function onTouchStart(e) {
  e.preventDefault();
  const el = e.currentTarget;
  draggedId = el.dataset.id;
  const rect = el.getBoundingClientRect();
  const touch = e.touches[0];
  touchOffsetX = touch.clientX - rect.left - rect.width/2;
  touchOffsetY = touch.clientY - rect.top - rect.height/2;
  const item = ITEMS.find(i => i.id === draggedId);
  ghost.textContent = item.emoji;
  ghost.style.display = 'block';
  ghost.style.left = touch.clientX + 'px';
  ghost.style.top = touch.clientY + 'px';
  el.classList.add('dragging');

  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd);
}

function onTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  ghost.style.left = touch.clientX + 'px';
  ghost.style.top = touch.clientY + 'px';

  // Highlight zones under finger
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('drag-over'));
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const zone = el?.closest('.zone');
  if (zone) zone.classList.add('drag-over');
}

function onTouchEnd(e) {
  ghost.style.display = 'none';
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('drag-over'));
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend', onTouchEnd);

  const touch = e.changedTouches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const zone = el?.closest('.zone');
  const dragEl = document.getElementById('item-' + draggedId);
  if (dragEl) dragEl.classList.remove('dragging');

  if (zone && draggedId) {
    handleDrop(zone.dataset.type, zone, draggedId);
  }
  draggedId = null;
}

function handleDrop(zoneType, zoneEl, itemId) {
  const item = ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const el = document.getElementById('item-' + itemId);

  if (item.type === zoneType) {
    // ✅ Correct
    el.classList.add('solved');
    score++;
    updateStars();

    // Add to zone
    const zoneItems = document.getElementById('items-' + zoneType);
    const span = document.createElement('div');
    span.className = 'zone-item';
    span.textContent = item.emoji;
    zoneItems.appendChild(span);

    // Glow zone
    zoneEl.classList.add('glow-correct');
    setTimeout(() => zoneEl.classList.remove('glow-correct'), 600);

    // Particles
    spawnParticles(zoneEl);

    showFeedback('✅ ممتاز! أحسنت!', 'correct');
    playSound('correct');

    if (score === ITEMS.length) setTimeout(showWin, 600);
  } else {
    // ❌ Wrong
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 500);
    showFeedback('❌ حاول مرة أخرى!', 'wrong');
    playSound('wrong');
  }
}

function showFeedback(msg, type) {
  feedbackEl.textContent = msg;
  feedbackEl.className = 'feedback ' + type + ' show';
  clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => feedbackEl.classList.remove('show'), 1800);
}

function updateStars() {
  for (let i = 1; i <= ITEMS.length; i++) {
    const s = document.getElementById('s' + i);
    if (s) {
      if (i <= score) s.classList.add('lit');
      else s.classList.remove('lit');
    }
  }
}

function spawnParticles(zone) {
  const rect = zone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  ['⭐','✨','🌟'].forEach((em, i) => {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = em;
    p.style.left = (cx + (i-1)*20) + 'px';
    p.style.top = cy + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  });
}

function showWin() {
  document.getElementById('winScreen').classList.add('show');
  startConfetti();
}

function resetGame() {
  score = 0;
  updateStars();
  document.getElementById('winScreen').classList.remove('show');
  document.getElementById('items-solid').innerHTML = '';
  document.getElementById('items-liquid').innerHTML = '';
  document.getElementById('items-gas').innerHTML = '';
  stopConfetti();
  buildItems();
}

// Simple Sound via AudioContext
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.setValueAtTime(660, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2);
    } else {
      osc.frequency.setValueAtTime(250, ctx.currentTime);
      osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
    }
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

// Confetti
let confettiInterval = null;
const canvas = document.getElementById('confetti-canvas');
const ctx2 = canvas.getContext('2d');
let particles2 = [];

function startConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  for (let i = 0; i < 120; i++) {
    particles2.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 8 + 4,
      d: Math.random() * 120 + 30,
      color: ['#FF6B6B','#4ECDC4','#A78BFA','#FDD835','#FF8A65','#81C784'][Math.floor(Math.random()*6)],
      tilt: Math.random() * 10 - 10,
      angle: 0, speed: Math.random() * 3 + 1
    });
  }
  confettiInterval = setInterval(drawConfetti, 16);
}

function drawConfetti() {
  ctx2.clearRect(0, 0, canvas.width, canvas.height);
  particles2.forEach(p => {
    p.angle += 0.05;
    p.y += p.speed;
    p.x += Math.sin(p.angle) * 1.5;
    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    ctx2.beginPath();
    ctx2.fillStyle = p.color;
    ctx2.save();
    ctx2.translate(p.x, p.y);
    ctx2.rotate(p.angle);
    ctx2.fillRect(-p.r/2, -p.r/2, p.r, p.r);
    ctx2.restore();
  });
}

function stopConfetti() {
  clearInterval(confettiInterval);
  ctx2.clearRect(0, 0, canvas.width, canvas.height);
  particles2 = [];
}

// Init
buildItems();
</script>
</body>
</html>
